<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>whoami</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f2027; color: #fff; scroll-behavior: smooth; }

    /* === Hero === */
    .hero {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e3c72);
      background-size: 400% 400%; animation: gradientMove 15s ease infinite;
      padding: 0 20px; position: relative;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50% }
      50% { background-position: 100% 50% }
      100% { background-position: 0% 50% }
    }
    .hero img {
      width: 150px; height: 150px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.7);
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      margin-bottom: 20px; object-fit: cover;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .hero p { font-size: 1.2rem; color: #ddd; }
    .scroll-down { position: absolute; bottom: 20px; font-size: 1.2rem; color: #fff; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    /* === Status Badge (base) === */
    .status-badge {
      display: inline-flex; align-items: center;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 12px;
      border: 1px solid;
      user-select: none;
    }
    .status-badge .dot {
      width: 10px; height: 10px; border-radius: 50%;
      margin-right: 8px;
    }

    /* Online */
    .status-online {
      background: rgba(0, 255, 153, 0.15);
      border-color: rgba(0, 255, 153, 0.4);
      color: #00ff99;
    }
    .status-online .dot {
      background: #00ff99;
      box-shadow: 0 0 6px #00ff99;
    }

    /* AFK / Sleeping */
    .status-afk {
      background: rgba(255, 59, 48, 0.15);
      border-color: rgba(255, 59, 48, 0.4);
      color: #ff3b30;
    }
    .status-afk .dot {
      background: #ff3b30;
      box-shadow: 0 0 6px #ff3b30;
    }

    /* Weekend Mode */
    .status-weekend {
      background: rgba(52, 152, 219, 0.15);
      border-color: rgba(52, 152, 219, 0.4);
      color: #5dade2;
    }
    .status-weekend .dot {
      background: #5dade2;
      box-shadow: 0 0 6px #5dade2;
    }

    /* === Section Genel === */
    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    section h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-align: center;
    }

    /* === About (terminal style) === */
    .about { display: flex; justify-content: center; }
    .terminal {
      font-size: 1.1rem; line-height: 1.6; font-family: 'Source Code Pro', monospace;
      color: #00ff99; background: rgba(0, 0, 0, 0.85);
      padding: 15px 20px; border-radius: 8px;
      border: 1px solid rgba(0,255,153,0.4);
      box-shadow: 0 0 10px rgba(0,255,153,0.4);
      width: fit-content; max-width: 95%;
      white-space: pre-wrap; word-break: break-word;
    }
    .cursor {
      display: inline-block; width: 10px; background: #00ff99;
      margin-left: 2px; animation: blink 1s infinite;
    }
    @keyframes blink { 50% { background: transparent; } }

    /* === Social Media === */
    .social-links {
      display: flex; justify-content: center; gap: 20px;
      flex-wrap: wrap; margin-top: 20px;
    }
    .social-links a {
      width: 55px; height: 55px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: #fff;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .social-links a:hover { transform: scale(1.2); }
    .social-links a.twitter:hover { background: #1da1f2; }
    .social-links a.instagram:hover { background: #e4405f; }
    .social-links a.github:hover { background: #333; }
    .social-links a.linkedin:hover { background: #0077b5; }

    /* === Cyber Security === */
    .cyber {
      display: flex; justify-content: center; gap: 40px;
      flex-wrap: wrap; margin-top: 30px;
    }
    .cyber a img {
      width: 80px; height: auto;
      filter: brightness(0) invert(1);
      transition: transform 0.3s ease;
    }
    .cyber a img:hover { transform: scale(1.15); }

    /* === Certificates === */
    .certs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px; margin-top: 20px;
    }
    .certs div {
      background: rgba(255,255,255,0.1);
      padding: 15px; border-radius: 12px; text-align: center;
      transition: all 0.3s ease;
    }
    .certs div:hover {
      background: rgba(0,255,153,0.3);
      transform: translateY(-5px);
    }

    /* === Footer === */
    footer {
      text-align: center; padding: 30px; font-size: 0.9rem;
      color: #ccc; border-top: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <!-- Hero -->
  <div class="hero">
    <img src="https://i.hizliresim.com/j00s72t.jpg" alt="Profil Resmi">
    <h1>Göktuğ Kaya</h1>
    <p>Hacker & Cyber Security Consultant | Forza Bursaspor!</p>

    <!-- Status Badge -->
    <div class="status-badge status-online" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Online</span>
    </div>

    <div class="scroll-down">⬇️ Scroll</div>
  </div>

  <!-- About -->
  <section>
    <h2>🧑‍💻 About Me</h2>
    <div class="about">
      <div class="terminal" id="terminal"></div>
    </div>
  </section>

  <!-- Social Media -->
  <section>
    <h2>🌐 Social Media</h2>
    <div class="social-links">
      <a href="https://twitter.com/g0ktugkaya" target="_blank" class="twitter"><i class="fab fa-twitter"></i></a>
      <a href="https://instagram.com/goktugkaya16" target="_blank" class="instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://linkedin.com/in/g0ktugkaya" target="_blank" class="linkedin"><i class="fab fa-linkedin"></i></a>
    </div>
  </section>

  <!-- Cyber Security -->
  <section>
    <h2>🐞 Bug Bounty</h2>
    <div class="cyber">
      <a href="https://hackerone.com/g0ktug" target="_blank"><img src="https://www.svgrepo.com/show/353850/hacker-one.svg" alt="HackerOne"></a>
      <a href="https://app.intigriti.com/researcher/profile/g0ktug" target="_blank"><img src="https://www.svgrepo.com/show/330708/intigriti.svg" alt="Intigriti"></a>
      <a href="https://bugcrowd.com/h/g0ktug" target="_blank"><img src="https://images.icon-icons.com/3911/PNG/512/bugcrowd_logo_icon_247420.png" alt="Bugcrowd"></a>
    </div>
  </section>

  <!-- Certificates -->
  <section>
    <h2>📜 Certificates</h2>
    <div class="certs">
      <div>eCPPTv2</div>
      <div>OSCP</div>
      <div>OSCP+</div>
      <div>TSE Certified Penetration Test Expert</div>
      <div>WEB-RTA</div>
      <div>API-RTA</div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    Made with ❤️ by Göktuğ Kaya
  </footer>

  <!-- Typing Effect Script + Status Logic -->
  <script>
    const lines = [
      "┌─[goktug@kali]─[~]",
      "└──╼ $ whoami",
      "Self taught Hacker & Bug Bounty Hunter from 🇹🇷"
    ];

    let lineIndex = 0;
    let charIndex = 0;
    const terminal = document.getElementById("terminal");
    let currentLine = document.createElement("div");
    terminal.appendChild(currentLine);

    function typeWriter() {
      if (lineIndex < lines.length) {
        if (charIndex < lines[lineIndex].length) {
          currentLine.textContent += lines[lineIndex].charAt(charIndex);
          charIndex++;
          setTimeout(typeWriter, 60);
        } else {
          charIndex = 0;
          lineIndex++;
          if (lineIndex < lines.length) {
            currentLine = document.createElement("div");
            terminal.appendChild(currentLine);
          }
          setTimeout(typeWriter, 400);
        }
      } else {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        currentLine.appendChild(cursor);
      }
    }

    function updateStatusBadge() {
      const badge = document.getElementById("statusBadge");
      const text = document.getElementById("statusText");

      // Türkiye saati
      const trNow = new Date(
        new Date().toLocaleString("en-US", { timeZone: "Europe/Istanbul" })
      );

      const day = trNow.getDay();   // 0=Pazar, 1=Pzt, ... 6=Cmt
      const hour = trNow.getHours();

      const isWeekendMode =
        (day === 6 && hour >= 9) ||        // Cumartesi 09:00+
        (day === 0 && hour < 22) ||        // Pazar 00:00-21:59
        (day === 0 && hour >= 0 && hour < 22); // netleştirme (aynı)

      const isAfkSleeping =
        (day >= 1 && day <= 5) && (hour >= 22 || hour < 9); // Hafta içi 22:00-09:00

      // class reset
      badge.classList.remove("status-online", "status-afk", "status-weekend");

      if (isWeekendMode) {
        badge.classList.add("status-weekend");
        text.textContent = "Weekend Mode 🍺🏟️";
      } else if (day === 0 && hour >= 22) {
        // Pazar 22:00 sonrası -> hafta içi moduna geç (Online kabul)
        badge.classList.add("status-online");
        text.textContent = "Online";
      } else if (isAfkSleeping) {
        badge.classList.add("status-afk");
        text.textContent = "AFK / Sleeping 😴";
      } else {
        badge.classList.add("status-online");
        text.textContent = "Online";
      }
    }

    window.onload = () => {
      typeWriter();
      updateStatusBadge();
      setInterval(updateStatusBadge, 30000);
    };
  </script>
</body>
</html>
